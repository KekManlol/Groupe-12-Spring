openapi: 3.0.3
info:
  title: Groupe 12 account service
  description: Microservice handling database of accounts in Groupe 12 project
  version: 1.0.0
servers:
  - url: http://localhost:9001
    description: Development server
paths:

  /accounts/{hash}:
    parameters:
      - name: hash
        in: path
        description: Hash of the account
        required: true
        schema:
          type: string
          example: dQw4w9WgXcQ

    post:
      summary: Create an account
      requestBody:
        description: Account to create
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/account'
      responses:
        400:
          description: Hash does not match or account invalid
        409:
          description: Account already exists
        201:
          description: Created account

    get:
      summary: Read an account and its total value
      responses:
        404:
          description: Account not found
        200:
          description: Returned account
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/video'

    put:
      summary: Update an account
      requestBody:
        description: New values of the account
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/account'
      responses:
        400:
          description: Hash does not match or account invalid
        404:
          description: Account not found
        200:
          description: Updated account

    delete:
      summary: Delete an account
      responses:
        404:
          description: Account not found
        200:
          description: Deleted account

  /videos/user/{author}:
    parameters:
      - name: author
        in: path
        required: true
        description: Author of the videos
        schema:
          type: string
          example: Cat4Life

    get:
      summary: Read all videos from an author
      responses:
        200:
          description: Returned list of videos
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/video'

    delete:
      summary: Delete all videos from an author
      responses:
        200:
          description: Deleted videos


components:
  schemas:
    account:
      type: object
      properties:
        hash:
          type: string
        name:
          type: string
        cash:
          type: integer
          description: in euros
        titles:
          type: dictionary
      example:
        hash: dQw4w9WgXcQ
        name: John Smith
        cash: 21404.32
        titles: {"Title A": 50, "Title B" : 10}
